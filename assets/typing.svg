<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 50" width="880" height="50" role="img" aria-label="Informatics Engineering Student | Data Science / BI Developer">
  <defs>
    <linearGradient id="stripBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#080c1a"/>
      <stop offset="50%" stop-color="#0e1328"/>
      <stop offset="100%" stop-color="#080c1a"/>
    </linearGradient>
    <linearGradient id="stripBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#a020f0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.65"/>
    </linearGradient>
    <clipPath id="typeClip">
      <rect class="reveal" x="52" y="8" width="542" height="34"/>
    </clipPath>
  </defs>
  <style>
    .reveal {
      transform-origin: 52px 25px;
      animation: typing 8.5s steps(61, end) infinite;
    }
    .cursor {
      animation: cursorMove 8.5s steps(61, end) infinite, blink 0.85s step-end infinite;
    }
    @keyframes typing {
      0% { transform: scaleX(0); }
      45% { transform: scaleX(1); }
      88% { transform: scaleX(1); }
      100% { transform: scaleX(0); }
    }
    @keyframes cursorMove {
      0% { transform: translateX(0px); }
      45% { transform: translateX(542px); }
      88% { transform: translateX(542px); }
      100% { transform: translateX(0px); }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .reveal { animation: none; transform: scaleX(1); }
      .cursor { animation: none; transform: translateX(542px); opacity: 0.9; }
    }
  </style>

  <polygon points="12,3 868,3 877,12 877,38 868,47 12,47 3,38 3,12" fill="url(#stripBg)" stroke="url(#stripBorder)" stroke-width="1.3"/>
  <rect x="20" y="21" width="5" height="5" fill="#22d3ee"/>
  <text x="34" y="30" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="14" font-weight="700" fill="#a020f0">&gt;</text>

  <g clip-path="url(#typeClip)">
    <text x="52" y="30" textLength="536" lengthAdjust="spacing" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="14.5" font-weight="600" fill="#c4b5fd">Informatics Engineering Student | Data Science / BI Developer</text>
  </g>
  <rect class="cursor" x="54" y="16" width="8" height="18" fill="#a020f0"/>
</svg>
